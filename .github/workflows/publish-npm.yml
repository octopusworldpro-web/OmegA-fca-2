name: Verify npm release candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Run tests and type checks
        run: |
          npm test
          npm run test:types
          npm run test:syntax
      - name: Verify package exports
        run: |
          node -e 'const p=require("./"); for (const k of ["createClient","createGoatBotLogin","createFacebookMqttClient","createFacebookMqttDriver","createSessionGuard","createMetaMessengerTransport","verifyWebhookSignature"]) if (typeof p[k] !== "function") throw new Error("Missing export "+k)'
      - name: Review publishable package contents
        run: npm pack --dry-run --json
